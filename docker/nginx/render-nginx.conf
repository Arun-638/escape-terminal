events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    upstream ctfd_backend {
        server 127.0.0.1:8000;
    }

    upstream terminal_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen ${PORT};
        server_name _;

        # WebSocket proxy for terminal sessions
        location /ws/ {
            proxy_pass http://terminal_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Terminal UI
        location /terminal {
            proxy_pass http://terminal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Terminal Service API (proctor, validation, hints)
        location /api/terminal/ {
            proxy_pass http://terminal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Terminal Live Scoreboard
        location /terminal-scoreboard {
            proxy_pass http://terminal_backend/scoreboard;
            proxy_set_header Host $host;
        }

        # Terminal Admin / Proctor Pardon Panel
        location /admin-proctor {
            proxy_pass http://terminal_backend/admin;
            proxy_set_header Host $host;
        }

        # Terminal Service Static Files
        location /static/ {
            proxy_pass http://terminal_backend;
            proxy_set_header Host $host;
        }

        # Primary CTFd Application (Home, Login, Register, Teams, Challenges)
        location / {
            proxy_pass http://ctfd_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
